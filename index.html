<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#103f35" />
    <meta
      name="description"
      content="A simple, offline scorekeeper for Nepali Marriage. Maal, rounds and clear settlement."
    />
    <title>Marriage · Hisab Kitab</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <style>:root {
  color-scheme: light;
  --bg: #f4f6f5;
  --surface: #fff;
  --ink: #193b33;
  --muted: #66756f;
  --line: #e0e7e3;
  --green: #103f35;
  --positive: #147457;
  --negative: #b74442;
  --soft: #eaf2ee;
  --shadow: 0 8px 30px #193b3306;
  font-family:
    Inter,
    "Avenir Next",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 16px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select,
summary {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.45;
}
button {
  border: 0;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #bf964c;
  outline-offset: 3px;
}
a {
  color: var(--positive);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(1.8rem, 3.5vw, 2.7rem);
  letter-spacing: -0.05em;
  line-height: 1.17;
  font-weight: 650;
}
h2 {
  font-size: 1.35rem;
  line-height: 1.3;
  letter-spacing: -0.025em;
}
h3 {
  font-size: 1rem;
}
p {
  margin-top: 0.6rem;
}
small,
.small {
  font-size: 0.875rem;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  font-weight: 700;
  margin: 0 0 0.7rem;
  color: var(--muted);
}
.topbar {
  height: 98px;
  max-width: 1232px;
  margin: auto;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  color: var(--ink);
  font-size: 1.25rem;
  font-weight: 750;
  text-align: left;
  line-height: 1.1;
}
.brand small {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 0.17em;
  margin-top: 7px;
  font-weight: 600;
  color: var(--muted);
}
.brand-mark {
  width: 44px;
  height: 48px;
  background: var(--green);
  border-radius: 12px;
  color: #f1d08c;
  display: grid;
  place-items: center;
  font-size: 2rem;
}
.desktop-nav {
  display: flex;
  gap: 8px;
}
.desktop-nav button {
  padding: 10px 18px;
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 600;
}
.desktop-nav button.active {
  background: var(--soft);
  color: var(--ink);
}
.topbar-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.icon-button {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
}
.button {
  min-height: 46px;
  padding: 12px 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 9px;
  font-size: 0.9rem;
  font-weight: 650;
  line-height: 1.35;
  border: 1px solid transparent;
  transition:
    background 0.15s,
    transform 0.15s;
}
.button:hover:not(:disabled) {
  transform: translateY(-1px);
}
.primary,
.success {
  background: var(--green);
  color: #fff;
}
.secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink);
}
.gold {
  background: #f1d08c;
  color: #193b33;
}
.ghost {
  background: transparent;
  color: var(--muted);
}
.danger {
  background: #ab3838;
  color: white;
}
.text-button,
.back-link {
  background: transparent;
  color: var(--positive);
  font-size: 0.875rem;
  padding: 10px 0;
  font-weight: 600;
}
.danger-text {
  color: var(--negative);
}
.full {
  width: 100%;
}
.back-link {
  display: block;
  margin-bottom: 16px;
  color: var(--muted);
}
#main-content {
  max-width: 1232px;
  padding: 42px 40px 56px;
  margin: auto;
  min-height: calc(100vh - 178px);
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 30px;
}
.local-badge {
  border: 1px solid var(--line);
  padding: 7px 12px;
  color: var(--muted);
  font-size: 0.75rem;
  border-radius: 30px;
  white-space: nowrap;
}
.welcome-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 24px;
}
.table-banner {
  position: relative;
  overflow: hidden;
  min-height: 310px;
  background: var(--green);
  border-radius: 18px;
  padding: 34px 36px 24px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.table-banner .eyebrow {
  color: #b9d1c6;
}
.table-banner h2 {
  font-size: 2.6rem;
  line-height: 1.07;
  letter-spacing: -0.04em;
  margin: 14px 0 10px;
  font-weight: 500;
}
.table-banner p {
  color: #c1d4cb;
  margin-bottom: 24px;
  font-size: 0.9rem;
}
.suit-mark {
  position: absolute;
  right: 35px;
  top: 32px;
  color: #f1d08c;
  font-size: 11rem;
  line-height: 1;
  transform: rotate(12deg);
  opacity: 0.85;
  pointer-events: none;
}
.table-banner > div:first-child {
  z-index: 1;
}
.banner-bottom {
  padding-top: 28px;
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: #b9d1c6;
}
.quick-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  padding: 30px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  box-shadow: var(--shadow);
}
.quick-card h2 {
  font-size: 1.6rem;
  overflow-wrap: anywhere;
}
.quick-card > .button {
  margin-top: auto;
}
.avatar-stack {
  display: flex;
  margin: 22px 0;
}
.avatar-stack .avatar {
  margin-right: -8px;
  border: 3px solid var(--surface);
}
.simple-steps {
  padding-left: 20px;
  margin: 20px 0;
  line-height: 2.3;
  color: var(--muted);
  font-size: 0.9rem;
}
.simple-steps li::marker {
  color: var(--positive);
  font-weight: 700;
}
.section {
  margin-top: 38px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.section-title .eyebrow {
  margin-bottom: 4px;
}
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.card,
.quick-card,
.settlement-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card {
  padding: 24px;
}
.game-card {
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  color: var(--ink);
  padding: 22px;
}
.game-card-copy {
  flex: 1;
  min-width: 0;
}
.game-card h3 {
  overflow-wrap: anywhere;
}
.game-card p,
.game-card small {
  color: var(--muted);
  font-size: 0.875rem;
}
.game-card small {
  display: block;
  margin-top: 4px;
}
.game-icon {
  width: 44px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--soft);
  font-size: 1.5rem;
  border-radius: 9px;
}
.chevron {
  color: var(--muted);
  font-size: 1.4rem;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 14px;
  text-align: center;
  padding: 36px 20px;
  background: var(--surface);
}
.empty p {
  color: var(--muted);
  font-size: 0.9rem;
}
.empty .button {
  margin-top: 18px;
}
.empty-symbol {
  color: var(--muted);
  font-size: 2rem;
  display: block;
  margin-bottom: 10px;
}
.site-footer {
  max-width: 1232px;
  margin: auto;
  padding: 20px 40px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 0.75rem;
}
.mobile-nav {
  display: none;
}
.modal-open {
  overflow: hidden;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #0a211c80;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(5px);
}
.modal {
  width: 100%;
  max-width: 620px;
  max-height: 90dvh;
  overflow: auto;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 24px 100px #0004;
}
.modal.compact {
  max-width: 440px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 28px;
  border-bottom: 1px solid var(--line);
}
.modal-header .eyebrow {
  margin-bottom: 4px;
}
.close {
  background: var(--soft);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  color: var(--ink);
  font-size: 1.5rem;
}
.modal-body {
  padding: 24px 28px;
}
.modal-footer {
  padding: 18px 28px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  border-top: 1px solid var(--line);
  position: sticky;
  bottom: 0;
  background: var(--surface);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 18px;
}
.field label {
  font-size: 0.875rem;
  font-weight: 600;
}
.field small {
  color: var(--muted);
  font-size: 0.75rem;
}
input:not([type="checkbox"]),
select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  min-height: 46px;
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--green);
  flex-shrink: 0;
}
.player-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.rate-field {
  margin-top: 4px;
}
.house-rules {
  margin-top: 22px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
}
.house-rules summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
}
.house-rules summary span {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 400;
  margin-left: 10px;
}
.house-rules[open] summary {
  margin-bottom: 18px;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  margin: 8px 0;
}
.round-layout,
.board-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 28px;
  align-items: start;
}
.round-player-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.player-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 14px;
  padding: 20px;
}
.player-card.is-winner {
  border: 2px solid #bd9859;
  padding: 19px;
  background: linear-gradient(145deg, var(--surface), var(--soft));
}
.player-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  background: #dcebe5;
  color: #225d46;
  font-weight: 650;
  font-size: 0.875rem;
}
.color-1 {
  background: #eee7d9;
  color: #826b35;
}
.color-2 {
  background: #e3e9f0;
  color: #476681;
}
.color-3 {
  background: #eee4e8;
  color: #885a72;
}
.player-name {
  flex: 1;
  font-size: 0.95rem;
  overflow-wrap: anywhere;
  min-width: 40px;
}
.winner-select {
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: var(--surface);
  color: var(--muted);
  min-height: 36px;
}
.winner-select.selected {
  background: #efddb0;
  color: #5d471b;
  border-color: transparent;
  font-weight: 700;
}
.segmented {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.segmented button {
  flex: 1;
  min-height: 36px;
  background: transparent;
  border-radius: 5px;
  color: var(--muted);
  font-size: 0.875rem;
}
.segmented button.selected {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 4px #0001;
  font-weight: 600;
}
.maal-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 20px 0 14px;
}
.maal-label {
  font-size: 0.875rem;
  color: var(--muted);
}
.stepper {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stepper button {
  background: var(--bg);
  color: var(--ink);
  width: 36px;
  height: 40px;
  font-size: 1.2rem;
}
.stepper input {
  width: 54px;
  min-height: 40px;
  padding: 5px;
  text-align: center;
  border: 0;
  border-radius: 0;
  font-weight: 700;
  appearance: textfield;
  -moz-appearance: textfield;
}
.stepper input::-webkit-inner-spin-button,
.stepper input::-webkit-outer-spin-button {
  appearance: none;
}
.player-bottom {
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  gap: 5px;
}
.player-bottom .small {
  font-size: 0.75rem;
}
.preview-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  position: sticky;
  top: 24px;
}
.maal-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 4px 0 20px;
  margin-bottom: 12px;
}
.maal-total span {
  color: var(--muted);
  font-size: 0.875rem;
}
.maal-total strong {
  font-size: 2rem;
  font-weight: 500;
}
.preview-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  font-size: 0.9rem;
  gap: 12px;
}
.preview-row > span:first-child {
  overflow-wrap: anywhere;
}
.preview-panel .full {
  margin-top: 24px;
}
.preview-panel > .small {
  text-align: center;
  font-size: 0.75rem;
}
.preview-panel > .text-button {
  display: block;
  margin: auto;
}
.score-number {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.positive {
  color: var(--positive);
}
.negative {
  color: var(--negative);
}
.zero {
  color: var(--muted);
}
.better-badge {
  background: var(--soft);
  border-radius: 6px;
  padding: 8px;
  font-size: 0.75rem;
  color: var(--positive);
}
.board-actions {
  display: flex;
  gap: 12px;
}
.leaderboard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.leader-row {
  display: flex;
  align-items: center;
  padding: 19px 22px;
  gap: 14px;
  border-bottom: 1px solid var(--line);
}
.leader-row:last-child {
  border: 0;
}
.rank {
  font-size: 0.75rem;
  color: var(--muted);
  width: 18px;
}
.leader-name {
  flex: 1;
  min-width: 0;
}
.leader-name strong {
  font-size: 0.95rem;
  overflow-wrap: anywhere;
}
.leader-name small,
.leader-score small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  margin-top: 3px;
}
.leader-score {
  text-align: right;
}
.leader-score .score-number {
  font-size: 1.3rem;
  letter-spacing: -0.04em;
}
.settlement-card {
  padding: 24px;
}
.settlement-card h2 {
  font-size: 1.3rem;
}
.transfer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 16px;
  gap: 16px;
  font-size: 0.875rem;
}
.transfer small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  margin-top: 3px;
}
.transfer strong {
  overflow-wrap: anywhere;
}
.settlement-empty {
  margin-top: 24px;
  background: var(--bg);
  padding: 20px;
  border-radius: 10px;
  font-size: 0.875rem;
  color: var(--muted);
}
.board-note {
  padding: 22px 4px;
  color: var(--muted);
  font-size: 0.8rem;
}
.board-note strong {
  color: var(--ink);
  font-size: 0.875rem;
}
.history-title {
  margin-top: 30px;
}
.table-wrap {
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.score-table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 0.875rem;
  text-align: right;
}
.score-table th,
.score-table td {
  padding: 15px 18px;
  border-bottom: 1px solid var(--line);
}
.score-table th {
  font-weight: 500;
  color: var(--muted);
  background: var(--bg);
  font-size: 0.8rem;
}
.score-table th:first-child,
.score-table td:first-child {
  text-align: left;
}
.score-table tbody tr:last-child td {
  border-bottom: 0;
}
.round-link {
  color: var(--ink);
  background: none;
  min-height: 24px;
}
.round-link span {
  color: var(--muted);
  font-size: 0.75rem;
  margin-left: 5px;
}
.round-winner {
  color: #a68036;
  margin-left: 5px;
}
.settings-layout,
.rules-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.9rem;
}
.setting-row input,
.setting-row select {
  max-width: 140px;
}
.setting-row small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
}
.form-section {
  margin-top: 24px;
}
.form-section h2 {
  font-size: 1rem;
  margin-bottom: 20px;
}
.import-button {
  margin-top: 12px;
  cursor: pointer;
}
.settings-layout aside > .button {
  margin-top: 18px;
}
.rule {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.9rem;
}
.rule p,
.rules-layout p {
  color: var(--muted);
}
.rule:last-child {
  border-bottom: 0;
}
.formula {
  background: var(--soft);
  padding: 18px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  margin: 20px 0;
}
.rule-list {
  margin: 16px 0 24px;
}

/* Marriage Club: warm ivory, forest felt and engraved brass. */

  );

  font-family: Georgia, "Times New Roman", serif;

  background: #183e32;

  border-radius: 9px;

    inset 0 0 0 3px #183e32,
    inset 0 0 0 4px #af935a66;
}
.desktop-nav {
  background: #e7e8de;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 40px;
}
.desktop-nav button {
  border-radius: 30px;
  min-width: 96px;
}
.desktop-nav button.active {
  background: var(--surface);
  box-shadow: 0 2px 5px #18382f0d;
}
#main-content {
  max-width: 1280px;
  padding-top: 38px;
}
h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(2rem, 4vw, 3.25rem);
  letter-spacing: -0.045em;
}
.page-heading .muted {
  font-size: 0.95rem;
}
.eyebrow {
  font-size: 0.68rem;
  letter-spacing: 0.19em;
}
.local-badge {
  background: var(--surface);
  font-size: 0.72rem;
}
.welcome-grid {
  grid-template-columns: 1.75fr 1fr;
  gap: 24px;
}
.table-banner {
  min-height: 355px;
  padding: 38px 38px 25px;
  background: radial-gradient(ellipse at 75% 30%, #28634c, #143e31 70%);
  border: 1px solid #264c3a;
  border-radius: 22px;
  box-shadow: 0 12px 24px #133e3118;
}
.table-banner:before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid #c5ab7040;
  border-radius: 15px;
  pointer-events: none;
}
.table-banner:after {
  content: "";
  position: absolute;
  width: 380px;
  height: 380px;
  border: 1px solid #d4bc7520;
  border-radius: 50%;
  right: -45px;
  top: -30px;
  pointer-events: none;
}
.table-banner h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(2.2rem, 3.4vw, 3.1rem);
  line-height: 1.06;
  letter-spacing: -0.035em;
}
.table-banner p {
  max-width: 270px;
  line-height: 1.6;
  color: #d3ded3;
}
.table-banner .eyebrow {
  color: #d9c79a;
}
.table-banner .gold {
  background: linear-gradient(110deg, #f0deab, #d3b576);
  border: 1px solid #f3dfad;
  box-shadow: 0 4px 12px #0002;
  min-width: 205px;
  justify-content: space-between;
}
.table-banner .gold span {
  font-size: 1.3rem;
}
.banner-bottom {
  z-index: 1;
  color: #c5d0bd;
  font-size: 0.63rem;
  letter-spacing: 0.14em;
}
.card-fan {
  position: absolute;
  right: 48px;
  top: 60px;
  width: 165px;
  height: 215px;
  pointer-events: none;
}
.playing-card {
  position: absolute;
  inset: 0;
  border-radius: 13px;
  background: #fcf7e8;
  color: #18372d;
  padding: 15px;
  box-shadow: 0 14px 25px #041c2750;
  border: 1px solid #efe2c3;
  transform-origin: 50% 90%;
}
.playing-card span {
  display: block;
  font:
    27px/1 Georgia,
    serif;
}
.playing-card small {
  display: block;
  font-size: 22px;
  margin-top: 4px;
}
.playing-card b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font:
    100px Georgia,
    serif;
}
.card-back {
  transform: rotate(-23deg) translateX(-36px);
  background: repeating-linear-gradient(
    45deg,
    #214e40,
    #214e40 4px,
    #2b5b49 4px,
    #2b5b49 6px
  );
  border: 6px solid #ede2c6;
  outline: 1px solid #dbcfb4;
}
.card-back span {
  position: absolute;
  inset: 8px;
  border: 1px solid #e7cea6;
  display: grid;
  place-items: center;
  font-size: 60px;
  color: #c8b585;
}
.card-red {
  transform: rotate(-10deg) translateX(-15px);
  color: #ac443e;
}
.card-ace {
  transform: rotate(9deg);
}
.playing-card .card-corner {
  position: absolute;
  bottom: 15px;
  right: 15px;
  transform: rotate(180deg);
}
.quick-card {
  padding: 30px;
  border-radius: 22px;
  box-shadow: var(--shadow);
}
.quick-card h2 {
  font:
    400 1.7rem/1.2 Georgia,
    serif;
  letter-spacing: -0.035em;
}
.simple-steps {
  list-style: none;
  counter-reset: steps;
  padding: 0;
  margin: 24px 0 12px;
  width: 100%;
}
.simple-steps li {
  counter-increment: steps;
  display: flex;
  align-items: center;
  gap: 12px;
  line-height: 1.4;
  margin-bottom: 18px;
}
.simple-steps li:before {
  content: counter(steps, decimal-leading-zero);
  font-size: 0.7rem;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--green);
}
.empty {
  border-style: solid;
  background: var(--surface);
  padding: 30px 20px;
  border-radius: 18px;
}
.empty-symbol {
  color: #9c8859;
}
.button {
  border-radius: 12px;
  min-height: 48px;
}
.primary {
  box-shadow: 0 3px 6px #183e3114;
}
.card,
.player-card,
.settlement-card,
.preview-panel {
  box-shadow: var(--shadow);
  border-radius: 18px;
}
.game-card:hover {
  border-color: #a4b4a2;
}
.player-card.is-winner {
  border-color: #b69b5b;
  background: linear-gradient(135deg, var(--surface), #eee5ce);
  box-shadow: 0 0 0 3px #b69b5b15;
}
.player-card.is-winner .winner-select {
  background: #e4d4aa;

}
.avatar {
  width: 42px;
  height: 42px;
  border: 3px double #769e8866;
}
.leaderboard {
  border-radius: 18px;

  box-shadow: var(--shadow);
}
.leader-row:first-child {
  background: linear-gradient(100deg, var(--soft), var(--surface));

.leader-row:first-child .rank {
  color: #95763b;

.leader-score .score-number {

.stepper input {
  font-size: 1.6rem;

.segmented {

}
.segmented button {
  min-height: 40px;
  border-radius: 8px;
}
.preview-panel {
  border-top: 3px solid #b29a62;
}
.settlement-card {
  border-top: 3px solid #b29a62;
}
.site-footer {
  font-size: 0.68rem;
  letter-spacing: 0.02em;
