<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103f35" />
    <meta

      content="A simple, offline scorekeeper for Nepali Marriage. Maal, rounds and clear settlement."
    />
    <title>Marriage · Hisab Kitab</title>

    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

    <style>
:root {
  color-scheme: light;
  --bg: #f4f6f5;
  --surface: #fff;
  --ink: #193b33;
  --muted: #66756f;
  --line: #e0e7e3;
  --green: #103f35;
  --positive: #147457;
  --negative: #b74442;
  --soft: #eaf2ee;
  --shadow: 0 8px 30px #193b3306;
  font-family:
    Inter,
    "Avenir Next",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 16px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select,
summary {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.45;
}
button {
  border: 0;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #bf964c;
  outline-offset: 3px;
}
a {
  color: var(--positive);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(1.8rem, 3.5vw, 2.7rem);
  letter-spacing: -0.05em;
  line-height: 1.17;
  font-weight: 650;
}
h2 {
  font-size: 1.35rem;
  line-height: 1.3;
  letter-spacing: -0.025em;
}
h3 {
  font-size: 1rem;
}
p {
  margin-top: 0.6rem;
}
small,
.small {
  font-size: 0.875rem;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  font-weight: 700;
  margin: 0 0 0.7rem;
  color: var(--muted);
}
.topbar {
  height: 98px;
  max-width: 1232px;
  margin: auto;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  color: var(--ink);
  font-size: 1.25rem;
  font-weight: 750;
  text-align: left;
  line-height: 1.1;
}
.brand small {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 0.17em;
  margin-top: 7px;
  font-weight: 600;
  color: var(--muted);
}
.brand-mark {
  width: 44px;
  height: 48px;
  background: var(--green);
  border-radius: 12px;
  color: #f1d08c;
  display: grid;
  place-items: center;
  font-size: 2rem;
}
.desktop-nav {
  display: flex;
  gap: 8px;
}
.desktop-nav button {
  padding: 10px 18px;
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 600;
}
.desktop-nav button.active {
  background: var(--soft);
  color: var(--ink);
}
.topbar-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.icon-button {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
}
.button {
  min-height: 46px;
  padding: 12px 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 9px;
  font-size: 0.9rem;
  font-weight: 650;
  line-height: 1.35;
  border: 1px solid transparent;
  transition:
    background 0.15s,
    transform 0.15s;
}
.button:hover:not(:disabled) {
  transform: translateY(-1px);
}
.primary,
.success {
  background: var(--green);
  color: #fff;
}
.secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink);
}
.gold {
  background: #f1d08c;
  color: #193b33;
}
.ghost {
  background: transparent;
  color: var(--muted);
}
.danger {
  background: #ab3838;
  color: white;
}
.text-button,
.back-link {
  background: transparent;
  color: var(--positive);
  font-size: 0.875rem;
  padding: 10px 0;
  font-weight: 600;
}
.danger-text {
  color: var(--negative);
}
.full {
  width: 100%;
}
.back-link {
  display: block;
  margin-bottom: 16px;
  color: var(--muted);
}
#main-content {
  max-width: 1232px;
  padding: 42px 40px 56px;
  margin: auto;
  min-height: calc(100vh - 178px);
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 30px;
}
.local-badge {
  border: 1px solid var(--line);
  padding: 7px 12px;
  color: var(--muted);
  font-size: 0.75rem;
  border-radius: 30px;
  white-space: nowrap;
}
.welcome-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 24px;
}
.table-banner {
  position: relative;
  overflow: hidden;
  min-height: 310px;
  background: var(--green);
  border-radius: 18px;
  padding: 34px 36px 24px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.table-banner .eyebrow {
  color: #b9d1c6;
}
.table-banner h2 {
  font-size: 2.6rem;
  line-height: 1.07;
  letter-spacing: -0.04em;
  margin: 14px 0 10px;
  font-weight: 500;
}
.table-banner p {
  color: #c1d4cb;
  margin-bottom: 24px;
  font-size: 0.9rem;
}
.suit-mark {
  position: absolute;
  right: 35px;
  top: 32px;
  color: #f1d08c;
  font-size: 11rem;
  line-height: 1;
  transform: rotate(12deg);
  opacity: 0.85;
  pointer-events: none;
}
.table-banner > div:first-child {
  z-index: 1;
}
.banner-bottom {
  padding-top: 28px;
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: #b9d1c6;
}
.quick-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  padding: 30px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  box-shadow: var(--shadow);
}
.quick-card h2 {
  font-size: 1.6rem;
  overflow-wrap: anywhere;
}
.quick-card > .button {
  margin-top: auto;
}
.avatar-stack {
  display: flex;
  margin: 22px 0;
}
.avatar-stack .avatar {
  margin-right: -8px;
  border: 3px solid var(--surface);
}
.simple-steps {
  padding-left: 20px;
  margin: 20px 0;
  line-height: 2.3;
  color: var(--muted);
  font-size: 0.9rem;
}
.simple-steps li::marker {
  color: var(--positive);
  font-weight: 700;
}
.section {
  margin-top: 38px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.section-title .eyebrow {
  margin-bottom: 4px;
}
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.card,
.quick-card,
.settlement-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card {
  padding: 24px;
}
.game-card {
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  color: var(--ink);
  padding: 22px;
}
.game-card-copy {
  flex: 1;
  min-width: 0;
}
.game-card h3 {
  overflow-wrap: anywhere;
}
.game-card p,
.game-card small {
  color: var(--muted);
  font-size: 0.875rem;
}
.game-card small {
  display: block;
  margin-top: 4px;
}
.game-icon {
  width: 44px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--soft);
  font-size: 1.5rem;
  border-radius: 9px;
}
.chevron {
  color: var(--muted);
  font-size: 1.4rem;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 14px;
  text-align: center;
  padding: 36px 20px;
  background: var(--surface);
}
.empty p {
  color: var(--muted);
  font-size: 0.9rem;
}
.empty .button {
  margin-top: 18px;
}
.empty-symbol {
  color: var(--muted);
  font-size: 2rem;
  display: block;
  margin-bottom: 10px;
}
.site-footer {
  max-width: 1232px;
  margin: auto;
  padding: 20px 40px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 0.75rem;
}
.mobile-nav {
  display: none;
}
.modal-open {
  overflow: hidden;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #0a211c80;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(5px);
}
.modal {
  width: 100%;
  max-width: 620px;
  max-height: 90dvh;
  overflow: auto;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 24px 100px #0004;
}
.modal.compact {
  max-width: 440px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 28px;
  border-bottom: 1px solid var(--line);
}
.modal-header .eyebrow {
  margin-bottom: 4px;
}
.close {
  background: var(--soft);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  color: var(--ink);
  font-size: 1.5rem;
}
.modal-body {
  padding: 24px 28px;
}
.modal-footer {
  padding: 18px 28px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  border-top: 1px solid var(--line);
  position: sticky;
  bottom: 0;
  background: var(--surface);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 18px;
}
.field label {
  font-size: 0.875rem;
  font-weight: 600;
}
.field small {
  color: var(--muted);
  font-size: 0.75rem;
}
input:not([type="checkbox"]),
select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  min-height: 46px;
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--green);
  flex-shrink: 0;
}
.player-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.rate-field {
  margin-top: 4px;
}
.house-rules {
  margin-top: 22px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
}
.house-rules summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
}
.house-rules summary span {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 400;
  margin-left: 10px;
}
.house-rules[open] summary {
  margin-bottom: 18px;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  margin: 8px 0;
}
.round-layout,
.board-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 28px;
  align-items: start;
}
.round-player-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.player-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 14px;
  padding: 20px;
}
.player-card.is-winner {
  border: 2px solid #bd9859;
  padding: 19px;
  background: linear-gradient(145deg, var(--surface), var(--soft));
}
.player-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  background: #dcebe5;
  color: #225d46;
  font-weight: 650;
  font-size: 0.875rem;
}
.color-1 {
  background: #eee7d9;
  color: #826b35;
}
.color-2 {
  background: #e3e9f0;
  color: #476681;
}
.color-3 {
  background: #eee4e8;
  color: #885a72;
}
.player-name {
  flex: 1;
  font-size: 0.95rem;
  overflow-wrap: anywhere;
  min-width: 40px;
}
.winner-select {
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: var(--surface);
  color: var(--muted);
  min-height: 36px;
}
.winner-select.selected {
  background: #efddb0;
  color: #5d471b;
  border-color: transparent;
  font-weight: 700;
}
.segmented {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.segmented button {
  flex: 1;
  min-height: 36px;
  background: transparent;
  border-radius: 5px;
  color: var(--muted);
  font-size: 0.875rem;
}
.segmented button.selected {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 4px #0001;
  font-weight: 600;
}
.maal-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 20px 0 14px;
}
.maal-label {
  font-size: 0.875rem;
  color: var(--muted);
}
.stepper {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stepper button {
  background: var(--bg);
  color: var(--ink);
  width: 36px;
  height: 40px;
  font-size: 1.2rem;
}
.stepper input {
  width: 54px;
  min-height: 40px;
  padding: 5px;
  text-align: center;
  border: 0;
  border-radius: 0;
  font-weight: 700;
  appearance: textfield;
  -moz-appearance: textfield;
}
.stepper input::-webkit-inner-spin-button,
.stepper input::-webkit-outer-spin-button {
  appearance: none;
}
.player-bottom {
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  gap: 5px;
}
.player-bottom .small {
  font-size: 0.75rem;
}
.preview-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  position: sticky;
  top: 24px;
}
.maal-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 4px 0 20px;
  margin-bottom: 12px;
}
.maal-total span {
  color: var(--muted);
  font-size: 0.875rem;
}
.maal-total strong {
  font-size: 2rem;
  font-weight: 500;
}
.preview-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  font-size: 0.9rem;
  gap: 12px;
}
.preview-row > span:first-child {
  overflow-wrap: anywhere;
}
.preview-panel .full {
  margin-top: 24px;
}
.preview-panel > .small {
  text-align: center;
  font-size: 0.75rem;
}
.preview-panel > .text-button {
  display: block;
  margin: auto;
}
.score-number {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.positive {
  color: var(--positive);
}
.negative {
  color: var(--negative);
}
.zero {
  color: var(--muted);
}
.better-badge {
  background: var(--soft);
  border-radius: 6px;
  padding: 8px;
  font-size: 0.75rem;
  color: var(--positive);
}
.board-actions {
  display: flex;
  gap: 12px;
}
.leaderboard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.leader-row {
  display: flex;
  align-items: center;
  padding: 19px 22px;
  gap: 14px;
  border-bottom: 1px solid var(--line);
}
.leader-row:last-child {
  border: 0;
}
.rank {
  font-size: 0.75rem;
  color: var(--muted);
  width: 18px;
}
.leader-name {
  flex: 1;
  min-width: 0;
}
.leader-name strong {
  font-size: 0.95rem;
  overflow-wrap: anywhere;
}
.leader-name small,
.leader-score small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  margin-top: 3px;
}
.leader-score {
  text-align: right;
}
.leader-score .score-number {
  font-size: 1.3rem;
  letter-spacing: -0.04em;
}
.settlement-card {
  padding: 24px;
}
.settlement-card h2 {
  font-size: 1.3rem;
}
.transfer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 16px;
  gap: 16px;
  font-size: 0.875rem;
}
.transfer small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  margin-top: 3px;
}
.transfer strong {
  overflow-wrap: anywhere;
}
.settlement-empty {
  margin-top: 24px;
  background: var(--bg);
  padding: 20px;
  border-radius: 10px;
  font-size: 0.875rem;
  color: var(--muted);
}
.board-note {
  padding: 22px 4px;
  color: var(--muted);
  font-size: 0.8rem;
}
.board-note strong {
  color: var(--ink);
  font-size: 0.875rem;
}
.history-title {
  margin-top: 30px;
}
.table-wrap {
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.score-table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 0.875rem;
  text-align: right;
}
.score-table th,
.score-table td {
  padding: 15px 18px;
  border-bottom: 1px solid var(--line);
}
.score-table th {
  font-weight: 500;
  color: var(--muted);
  background: var(--bg);
  font-size: 0.8rem;
}
.score-table th:first-child,
.score-table td:first-child {
  text-align: left;
}
.score-table tbody tr:last-child td {
  border-bottom: 0;
}
.round-link {
  color: var(--ink);
  background: none;
  min-height: 24px;
}
.round-link span {
  color: var(--muted);
  font-size: 0.75rem;
  margin-left: 5px;
}
.round-winner {
  color: #a68036;
  margin-left: 5px;
}
.settings-layout,
.rules-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.9rem;
}
.setting-row input,
.setting-row select {
  max-width: 140px;
}
.setting-row small {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
}
.form-section {
  margin-top: 24px;
}
.form-section h2 {
  font-size: 1rem;
  margin-bottom: 20px;
}
.import-button {
  margin-top: 12px;
  cursor: pointer;

// Source: js/core.js
const STORAGE = {
  games: "marriage-web-games",
  prefs: "marriage-web-prefs",
};
const defaultPrefs = {
  playerCount: 4,
  names: [],
  pointRate: 1,
  theme: "light",
};
const rates = [0.25, 0.5, 1, 2, 10, 100];

function load(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

const state = {
  view: "home",
  gameId: null,
  roundId: null,
  games: load(STORAGE.games, []),
  prefs: { ...defaultPrefs, ...load(STORAGE.prefs, {}) },
};

// Clear the inherited demonstration roster; keep customised player lists and games.
if (JSON.stringify(state.prefs.names) === JSON.stringify(["Saroj", "Raj", "Padam", "Prakash", "Pragyan"])) {
  state.prefs.names = [];
  localStorage.setItem(STORAGE.prefs, JSON.stringify(state.prefs));
}

function save() {
  localStorage.setItem(STORAGE.games, JSON.stringify(state.games));
  localStorage.setItem(STORAGE.prefs, JSON.stringify(state.prefs));
}
function id() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random()}`;
}
function money(n, currency = "NPR") {
  return `${n < 0 ? "−" : ""}${currency === "NPR" ? "Rs. " : "$"}${new Intl.NumberFormat("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(Math.abs(n))}`;
}
function dateLabel(iso) {
  return new Date(iso).toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric",
  });
}
function getGame() {
  return state.games.find((game) => game.id === state.gameId);
}
function total(game, playerId) {
  return game.rounds.reduce(
    (sum, round) => sum + (round.scores[playerId] || 0),
    0,
  );
}
function scoreClass(score) {
  return score > 0 ? "positive" : score < 0 ? "negative" : "zero";
}
function scoreBadge(score) {
  return `<span class="score-number ${scoreClass(score)}">${score > 0 ? "+" : ""}${score}</span>`;
}
function escape(value) {
  return String(value).replace(
    /[&<>'"]/g,
    (character) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[
        character
      ],
  );
}
function uniqueName() {
  const date = new Date();
  const base = `${date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })} Ko Game`;
  return `${base} (${date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })})`;
}

let renderer = () => {};
function setRenderer(render) {
  renderer = render;
}
function navigate(view, gameId = state.gameId, roundId = null) {
  state.view = view;
  state.gameId = gameId;
  state.roundId = roundId;
  renderer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}


// Source: js/scoring.js
// Net points: every player exchanges maal differences; opponents pay the finisher.
function calculateRound(entries, winnerId, settings) {
  if (
    entries.length < 2 ||
    new Set(entries.map((e) => e.playerId)).size !== entries.length
  )
    throw new Error("Choose at least two distinct players.");
  const winner = entries.find((e) => e.playerId === winnerId);
  if (!winner || winner.status !== "seen")
    throw new Error("The winner must be Seen.");
  for (const e of entries) {
    if (
      !["seen", "unseen"].includes(e.status) ||
      !Number.isSafeInteger(e.maalPoints) ||
      e.maalPoints < 0 ||
      e.maalPoints > 10000
    )
      throw new Error("Enter valid whole-number maal points (0–10,000).");
    if (e.status === "unseen" && (e.maalPoints !== 0 || e.dubli))
      throw new Error("Unseen players cannot count maal or play dublee.");
  }
  const seen = settings.seenPoint ?? 3,
    unseen = settings.unseenPoint ?? 10,
    bonus = settings.dubleeBonus ?? 0;
  if (
    ![seen, unseen, bonus].every(
      (v) => Number.isSafeInteger(v) && v >= 0 && v <= 10000,
    )
  )
    throw new Error("Invalid house-rule charges.");
  const totalMaal = entries.reduce((s, e) => s + e.maalPoints, 0);
  const multiplier = settings.better && entries.some((e) => e.dubli) ? 2 : 1;
  const scores = Object.fromEntries(entries.map((e) => [e.playerId, 0]));
  for (const e of entries.filter((e) => e.playerId !== winnerId)) {
    const charge =
      e.status === "unseen"
        ? unseen
        : e.dubli && settings.dubleeExempt !== false
          ? 0
          : seen;
    const payment =
      (totalMaal -
        entries.length * e.maalPoints +
        charge +
        (winner.dubli ? bonus : 0)) *
      multiplier;
    scores[e.playerId] = payment === 0 ? 0 : -payment;
    scores[winnerId] += payment;
  }
  return { scores, totalMaal, multiplier };
}
// Greedy net-balance settlement; at most n−1 transfers, not a global minimum guarantee.
function settleBalances(players, rounds, rate = 1) {
  const balances = players.map((p) => ({
    playerId: p.id,
    name: p.name,
    amount: Math.round(
      rounds.reduce((s, r) => s + (r.scores[p.id] || 0), 0) * rate * 100,
    ),
  }));
  const debt = balances
    .filter((p) => p.amount < 0)
    .map((p) => ({ ...p, amount: -p.amount }))
    .sort((a, b) => b.amount - a.amount);
  const credit = balances
    .filter((p) => p.amount > 0)
    .map((p) => ({ ...p }))
    .sort((a, b) => b.amount - a.amount);
  const out = [];
  let i = 0,
    j = 0;
  while (i < debt.length && j < credit.length) {
    const amount = Math.min(debt[i].amount, credit[j].amount);
    out.push({ from: debt[i].name, to: credit[j].name, amount: amount / 100 });
    debt[i].amount -= amount;
    credit[j].amount -= amount;
    if (!debt[i].amount) i++;
    if (!credit[j].amount) j++;
  }
  return out;
}

function validateBackup(data) {
  if (
    !data ||
    data.version !== 1 ||
    !Array.isArray(data.games) ||
    data.games.length > 1000
  )
    throw new Error("Invalid Marriage backup.");
  const safeId = (id) => typeof id === "string" && /^[A-Za-z0-9._-]{1,100}$/.test(id);
  const gameIds = new Set();
  for (const g of data.games) {
    if (
      !safeId(g.id) ||
      g.id.length > 100 ||
      gameIds.has(g.id) ||
      typeof g.name !== "string" ||
      g.name.length > 200 ||
      !Array.isArray(g.players) ||
      g.players.length < 2 ||
      g.players.length > 8 ||
      !Array.isArray(g.rounds) ||
      g.rounds.length > 10000 ||
      !Number.isFinite(Date.parse(g.createdAt)) ||
      !g.settings ||
      !Number.isFinite(g.settings.pointRate) ||
      g.settings.pointRate < 0 ||
      g.settings.pointRate > 10000
    )
      throw new Error("Invalid game in backup.");
    gameIds.add(g.id);
    const ids = new Set();
    for (const p of g.players) {
      if (
        !safeId(p.id) ||
        p.id.length > 100 ||
        typeof p.name !== "string" ||
        p.name.length > 100 ||
        ids.has(p.id)
      )
        throw new Error("Invalid players.");
      ids.add(p.id);
    }
    for (const key of ["seenPoint", "unseenPoint"])
      if (
        !Number.isSafeInteger(g.settings[key]) ||
        g.settings[key] < 0 ||
        g.settings[key] > 10000
      )
        throw new Error("Invalid rules.");
    if (
      g.settings.dubleeBonus != null &&
      (!Number.isSafeInteger(g.settings.dubleeBonus) ||
        g.settings.dubleeBonus < 0 ||
        g.settings.dubleeBonus > 10000)
    )
      throw new Error("Invalid dublee bonus.");
    if (
      g.settings.currency != null &&
      !["NPR", "USD"].includes(g.settings.currency)
    )
      throw new Error("Invalid currency.");
    const roundIds = new Set();
    for (const r of g.rounds) {
      if (
        !safeId(r.id) ||
        r.id.length > 100 ||
        roundIds.has(r.id) ||
        !Number.isSafeInteger(r.number) ||
        !ids.has(r.winnerId) ||
        !Number.isFinite(Date.parse(r.createdAt)) ||
        !Array.isArray(r.entries) ||
        r.entries.length !== g.players.length ||
        !r.scores ||
        Object.keys(r.scores).length !== g.players.length
      )
        throw new Error("Invalid round.");
      roundIds.add(r.id);
      if (
        new Set(r.entries.map((e) => e.playerId)).size !== ids.size ||
        r.entries.some((e) => !ids.has(e.playerId))
      )
        throw new Error("Invalid round players.");
      calculateRound(r.entries, r.winnerId, g.settings);
      if (
        [...ids].some(
          (id) =>
            !Number.isSafeInteger(r.scores[id]) || Math.abs(r.scores[id]) > 1e9,
        ) ||
        Object.values(r.scores).reduce((s, v) => s + v, 0) !== 0
      )
        throw new Error("Invalid scores.");
    }
  }
}

const views = {

  config: configView,
  rules: rulesView,
  scoreboard: scoreboardView,
  round: roundView,

const main = document.querySelector("#main-content"),
  modal = document.querySelector("#modal-root");
let restoreFocus = null,

function toast(text) {
  const t = document.querySelector("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}
function persist() {
  try {

    return false;
  }
}
function render() {
  document.querySelectorAll("[data-view]").forEach((b) => {
    const active = b.dataset.view === state.view;
    b.classList.toggle("active", active);
    active
      ? b.setAttribute("aria-current", "page")
      : b.removeAttribute("aria-current");
  });
  main.innerHTML = views[state.view]();
  document.documentElement.dataset.theme =
    state.prefs.theme === "dark" ? "dark" : "light";

function showModal(html) {
  restoreFocus = document.activeElement;
  modal.innerHTML = html;
  document.body.classList.add("modal-open");
  document.querySelector("#app-shell").inert = true;
  modal.querySelector("input,button")?.focus();
}
function closeModal() {

  document.querySelector("#app-shell").inert = false;
  restoreFocus?.focus();
}
function confirm(title, copy, action, label = "Confirm") {
  showModal(confirmModal(title, copy, label, "Cancel"));

  };
}
function readEntries() {
  return [...document.querySelectorAll("[data-player-card]")].map((c) => ({
    playerId: c.dataset.playerCard,
    maalPoints: Number(c.querySelector("[data-maal]").value),

}
function preview() {
  const form = document.querySelector("#round-form");
  if (!form) return;
  const entries = readEntries(),
    winner = document.querySelector("#winner").value;
  document.querySelector("#total-maal").textContent = entries.reduce(

    const { scores, multiplier } = calculateRound(
      entries,
      winner,
      getGame().settings,

    document.querySelector("#round-preview").innerHTML =
      getGame()
        .players.map(
          (p) =>
            `<div class="preview-row"><span>${escape(p.name)}</span>${scoreBadge(scores[p.id])}</div>`,

}
function status(card, seen) {
  card.dataset.status = seen ? "seen" : "unseen";
  const winner =
    card.dataset.playerCard === document.querySelector("#winner").value;
  card.querySelectorAll("[data-status]").forEach((b) => {
    const on = b.dataset.status === card.dataset.status;
    b.classList.toggle("selected", on);
    b.setAttribute("aria-pressed", String(on));
    b.disabled = winner;
  });
  card
    .querySelectorAll("[data-step],[data-maal],[data-dubli]")
    .forEach((c) => (c.disabled = !seen));
  if (!seen) {
    card.querySelector("[data-maal]").value = 0;
    card.querySelector("[data-dubli]").checked = false;
  }
  card.querySelector(".player-bottom .muted").textContent = seen
    ? "Maal counts"
    : "Maal does not count";
}
function pickWinner(playerId) {
  document.querySelector("#winner").value = playerId;
  document.querySelectorAll("[data-player-card]").forEach((c) => {
    const win = c.dataset.playerCard === playerId;
    c.classList.toggle("is-winner", win);
    const b = c.querySelector("[data-pick-winner]");
    b.classList.toggle("selected", win);
    b.setAttribute("aria-pressed", String(win));
    b.textContent = win ? "♛ Winner" : "Set winner";
    status(c, win || c.dataset.status === "seen");
  });
  preview();
}
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick-winner]");
  if (pick) {
    pickWinner(pick.dataset.pickWinner);
    return;
  }
  const st = e.target.closest("[data-status]");
  if (st && !st.disabled) {
    status(st.closest("[data-player-card]"), st.dataset.status === "seen");
    preview();
    return;
  }
  const step = e.target.closest("[data-step]");
  if (step && !step.disabled) {
    const input = step
      .closest("[data-player-card]")
      .querySelector("[data-maal]");
    input.value = Math.max(
      0,
      Math.min(10000, (Number(input.value) || 0) + Number(step.dataset.step)),
    );
    preview();
    return;
  }
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const a = b.dataset.action;
  if (a === "navigate") {
    const form = document.querySelector("#round-form");
    const changed = form && form.dataset.baseline !== JSON.stringify([readEntries(), document.querySelector("#winner").value]);
    if (changed) confirm("Leave this round?", "Unsaved changes will be lost.", () => navigate(b.dataset.view), "Leave round");
    else navigate(b.dataset.view);
  }
  if (a === "new-game") showModal(newGameForm());
  if (a === "close-modal") closeModal();
  if (a === "open-game") navigate("scoreboard", b.dataset.id);
  if (a === "add-round") navigate("round", state.gameId);
  if (a === "open-round") navigate("detail", state.gameId, b.dataset.id);
  if (a === "cancel-round")
    confirm(
      "Discard this round?",
      "Unsaved changes will be lost.",
      () => navigate("scoreboard", state.gameId),
      "Discard",
    );
  if (a === "toggle-theme") {
    state.prefs.theme = state.prefs.theme === "dark" ? "light" : "dark";
    persist();
    render();
  }
  if (a === "edit-round") {
    state.view = "round";
    render();
  }
  if (a === "delete-round" || a === "undo-round") {
    const g = getGame();
    const roundId = a === "undo-round" ? g.rounds.at(-1)?.id : state.roundId;
    confirm(
      a === "undo-round" ? "Undo last round?" : "Delete round?",
      "This round will be removed and totals recalculated.",
      () => {
        g.rounds = g.rounds.filter((r) => r.id !== roundId);
        g.rounds.forEach((r, i) => (r.number = i + 1));
        persist();
        navigate("scoreboard", g.id);
        toast("Round removed");
      },
      "Remove round",
    );
  }
  if (a === "delete-game") {
    const gameId = b.dataset.gameId || state.gameId;
    confirm(
      "Delete this game?",
      "All its rounds will be removed. Export a backup first if you need a copy.",
      () => {
        state.games = state.games.filter((g) => g.id !== gameId);
        persist();
        navigate("home", null);
      },
      "Delete game",
    );
  }
  if (a === "share") share();
  if (a === "export") {
    const blob = new Blob(
      [
        JSON.stringify(
          {
            version: 1,
            exportedAt: new Date().toISOString(),
            games: state.games,
            prefs: state.prefs,
          },
          null,
          2,
        ),
      ],
      { type: "application/json" },
    );
    const url = URL.createObjectURL(blob),
      link = document.createElement("a");
    link.href = url;
    link.download =
      "marriage-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Backup exported");
  }
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-maal]")) preview();
  if (e.target.matches("[data-pref-name]")) {
    state.prefs.names[Number(e.target.dataset.prefName)] = e.target.value;
    persist();
  }
  if (
    e.target.matches("[data-pref]") &&
    e.target.checkValidity() &&
    e.target.value !== ""
  ) {
    state.prefs[e.target.dataset.pref] = Number(e.target.value);
    persist();
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "player-count") {
    const values = [...document.querySelectorAll('[name^="player-"]')].map(
      (i) => i.value,
    );
    document.querySelector("#new-player-fields").innerHTML = playerFields(
      Array.from(
        { length: Number(e.target.value) },
        (_, i) => values[i] ?? state.prefs.names[i] ?? "",
      ),
    );
  }
  if (e.target.matches("[data-dubli]")) preview();
  if (e.target.id === "import-backup") {
    const file = e.target.files[0];
    if (!file) return;
    try {
      if (file.size > 5000000)
        throw new Error("Backup too large (limit 5 MB).");
      const data = JSON.parse(await file.text());
      validateBackup(data);
      let added = 0;
      for (const game of data.games)
        if (!state.games.some((g) => g.id === game.id)) {
          state.games.push(game);
          added++;
        }
      persist();
      render();
      toast(`${added} games imported`);
    } catch (error) {
      toast(error.message || "Invalid backup.");
    }
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "new-game-form") {
    e.preventDefault();
    const f = new FormData(e.target),
      count = Number(f.get("count"));
    const players = Array.from({ length: count }, (_, i) => ({
      id: id(),
      name: String(f.get("player-" + i)).trim(),
    }));
    if (
      players.some((p) => !p.name) ||
      new Set(players.map((p) => p.name.toLowerCase())).size !== count
    ) {
      toast("Use a different name for each player.");
      return;
    }
    const g = {
      id: id(),
      name: String(f.get("name")).trim() || "Card night",
      players,
      settings: {
        pointRate: Number(f.get("rate")),
        seenPoint: Number(f.get("seen")),
        unseenPoint: Number(f.get("unseen")),
        dubleeBonus: Number(f.get("bonus")),
        dubleeExempt: f.has("exempt"),
        better: f.has("better"),
        currency: "NPR",
      },
      rounds: [],
      createdAt: new Date().toISOString(),
    };
    state.games.unshift(g);
    persist();
    closeModal();
    navigate("round", g.id);
    toast("Your table is ready");
  }
  if (e.target.id === "round-form") {
    e.preventDefault();
    try {
      const g = getGame(),
        entries = readEntries(),
        winnerId = document.querySelector("#winner").value;
      const { scores } = calculateRound(entries, winnerId, g.settings);
      const existing = g.rounds.find((r) => r.id === e.target.dataset.editing);
      const round = {
        id: existing?.id || id(),
        number: existing?.number || g.rounds.length + 1,
        winnerId,
        entries,
        scores,
        createdAt: existing?.createdAt || new Date().toISOString(),
      };
      if (existing) g.rounds[g.rounds.indexOf(existing)] = round;
      else g.rounds.push(round);
      persist();
      navigate("scoreboard", g.id);
      toast("Round saved");
    } catch (error) {
      toast(error.message);
    }
  }
});
async function share() {
  const g = getGame();
  const text = `${g.name} · Marriage Hisab Kitab\n${g.rounds.length} rounds\n\n${g.players
    .map((p) => {
      const points = g.rounds.reduce((s, r) => s + (r.scores[p.id] || 0), 0);
      return `${p.name}: ${points > 0 ? "+" : ""}${points} pts · ${money(points * g.settings.pointRate, g.settings.currency || "USD")}`;
    })
    .join("\n")}`;
  try {
    if (navigator.share) await navigator.share({ title: g.name, text });
    else {
      await navigator.clipboard.writeText(text);
      toast("Scores copied");
    }
  } catch (e) {
    if (e.name !== "AbortError") toast("Sharing unavailable in this browser.");
  }
}
document.addEventListener("keydown", (e) => {

      ...modal.querySelectorAll('button,input,select,summary,[tabindex="0"]'),
